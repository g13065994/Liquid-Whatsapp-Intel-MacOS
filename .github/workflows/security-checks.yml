name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security-hardening-v2.3.1, production-integrity-cache]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: npm run check
  release:
    name: Build and publish v1.0.0
    if: (github.event_name == 'push' && github.ref == 'refs/heads/security-hardening-v2.3.1' && github.event.before == '66c25229ac84e0871ed11ec882d90a617c62bd66') || (github.event_name == 'pull_request' && github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15-intel
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: 66c25229ac84e0871ed11ec882d90a617c62bd66

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Catalina Intel release
        run: npm run build:catalina

      - name: Replace old build.11 release and publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("v1.0.0-build.")) | .tagName'); do
            echo "Deleting obsolete release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; refusing to replace an immutable release."
            exit 1
          fi

          gh release create v1.0.0 dist/*.dmg dist/*.zip \
            --target "66c25229ac84e0871ed11ec882d90a617c62bd66" \
            --title "Liquid WhatsApp v1.0.0" \
            --generate-notes
