name: Security checks

on:
  pull_request:
    branches: [security-hardening-v2.3.1]
  push:
    branches: [security-hardening-v2.3.1]

permissions:
  contents: read

jobs:
  lockfile:
    name: Generate dependency lockfile
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile"
          git push

  syntax:
    name: Syntax checks
    needs: lockfile
    if: needs.lockfile.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check

  audit:
    name: Dependency audit
    needs: lockfile
    if: needs.lockfile.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run npm audit
        run: npm audit

  build:
    name: Release-branch build validation
    needs: [lockfile, syntax, audit]
    if: needs.lockfile.result == 'success' && needs.syntax.result == 'success' && needs.audit.result == 'success'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Catalina Intel release
        run: npm run build:catalina
