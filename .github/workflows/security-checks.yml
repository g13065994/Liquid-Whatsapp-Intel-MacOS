name: Security checks

on:
  pull_request:
    branches: [security-hardening-v2.3.1]
  push:
    branches: [security-hardening-v2.3.1]

permissions:
  contents: read

jobs:
  lockfile:
    name: Generate dependency lockfile
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add reproducible npm lockfile"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error

  syntax:
    name: Syntax checks
    needs: lockfile
    if: always() && needs.lockfile.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: generated-package-lock
          path: .
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check

  audit:
    name: Dependency audit
    needs: lockfile
    if: needs.lockfile.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: generated-package-lock
          path: .
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run full npm audit
        run: npm audit
        continue-on-error: true
      - name: Gate on shipped dependencies
        run: npm audit --omit=dev

  build:
    name: Release-branch build validation
    needs: [lockfile, syntax]
    if: always() && needs.lockfile.result == 'success' && needs.syntax.result == 'success'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: generated-package-lock
          path: .
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Catalina Intel release
        run: npm run build:catalina
