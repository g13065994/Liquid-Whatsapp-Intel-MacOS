name: Build and Release Liquid WhatsApp

on:
  workflow_dispatch:
  push:
    branches:
      - security-hardening-v2.3.1
      - fix/runtime-integrity
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build Catalina Intel package
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check project
        run: npm run check

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build artifacts
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npm run release
          else
            npm run build:catalina
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/security-hardening-v2.3.1'
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-WhatsApp-Catalina-Intel-DMG
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload ZIP artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/security-hardening-v2.3.1'
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-WhatsApp-Catalina-Intel-ZIP
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub release from branch build
        if: github.ref == 'refs/heads/security-hardening-v2.3.1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")-build.${GITHUB_RUN_NUMBER}"
          echo "Creating release $TAG from commit $GITHUB_SHA"

          gh release create "$TAG" dist/*.dmg dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Liquid WhatsApp $TAG" \
            --generate-notes

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "Release assets were published by electron-builder."
